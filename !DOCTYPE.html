<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1e;--glass:rgba(255,255,255,.055);--line:rgba(255,255,255,.1);--tx:#e8ecf8;--mut:#8b95b3;--hbg:rgba(10,15,30,.7);--inp:rgba(0,0,0,.28);--g2:#a78bfa;--acc:#5b8def;--blur:14px;--fs:15px;--ch:280px;--gap:20px;--hh:84px;color-scheme:dark}
[data-theme=aurora]{--bg:#06141a;--g2:#34d3a3;--hbg:rgba(6,20,26,.7)}
[data-theme=sunset]{--bg:#180d12;--g2:#f5a524;--hbg:rgba(24,13,18,.7)}
[data-theme=forest]{--bg:#09140e;--g2:#84cc16;--hbg:rgba(9,20,14,.7)}
[data-theme=paper]{--bg:#f2f4fa;--glass:rgba(255,255,255,.75);--line:rgba(20,30,60,.13);--tx:#161b2e;--mut:#5d6785;--hbg:rgba(242,244,250,.82);--inp:rgba(255,255,255,.9);color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font:var(--fs)/1.5 Inter,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
html[data-bg=aurora] body::before{background:radial-gradient(900px 520px at 8% -8%,color-mix(in srgb,var(--acc) 28%,transparent),transparent),radial-gradient(800px 500px at 100% 0,color-mix(in srgb,var(--g2) 20%,transparent),transparent)}
html[data-bg=grid] body::before{background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/40px 40px;opacity:.6}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.hdr{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 28px;background:var(--hbg);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);backdrop-filter:blur(var(--blur)) saturate(150%);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:18px}.brand span{color:var(--acc)}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav a{color:var(--mut);text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:500;transition:.2s}
nav a:hover{color:var(--tx);background:var(--glass)}
nav a[style]::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:8px}
.timer{display:flex;align-items:center;gap:8px}
#tMin{width:68px}
#tDisp{font:500 22px 'JetBrains Mono',monospace;min-width:76px;text-align:center}
.timer[data-mode=break] #tDisp{color:#34d3a3}
input,select,textarea{font:inherit;color:var(--tx);background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px;min-width:0}
input[type=color]{padding:3px;width:44px;cursor:pointer}
input[type=range]{padding:0;accent-color:var(--acc);min-height:24px}
select option{background:#141a33;color:#e8ecf8}
.btn{font:inherit;font-weight:600;color:var(--tx);background:var(--glass);border:1px solid var(--line);padding:9px 16px;border-radius:10px;cursor:pointer;min-height:40px;transition:.2s}
.btn:hover,.btn.on{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:var(--acc)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--g2));border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.chip{font-size:12px;color:var(--mut);background:var(--inp);padding:3px 10px;border-radius:999px}
main{max-width:1400px;margin:0 auto;padding:12px 28px 60px}
section{scroll-margin-top:var(--hh);padding-top:var(--gap);outline:none}
#player{min-height:calc(100vh - var(--hh))}
.sh{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:12px;flex-wrap:wrap}
h2{margin:0;font-size:1.45em}h3{margin:0;font-size:1.2em}
.glass{padding:16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.today{display:grid;grid-template-columns:2fr 1fr 1fr;gap:var(--gap);margin-bottom:var(--gap)}
.today small{display:block;color:var(--mut)}.today b{font-size:1.5em}
.bar{height:8px;border-radius:8px;background:var(--inp);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--g2));transition:width .4s}
.slot{display:grid;grid-template-columns:130px 1fr 120px auto auto;gap:10px;align-items:center;margin-bottom:10px}
.slot.head{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:var(--gap)}
.card{--c:#5b8def;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);border-top:3px solid var(--c);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));outline:none}
.card header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{display:flex;gap:6px}.tabs button{flex:1;font:inherit;font-weight:600;color:var(--mut);background:none;border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer}
.tabs .on{color:var(--tx);border-color:var(--c);background:color-mix(in srgb,var(--c) 25%,transparent)}
.add{display:grid;grid-template-columns:1fr auto;gap:8px}.add input[name=t]{grid-column:1/-1}
.list,.notes{height:var(--ch);scrollbar-width:thin;scrollbar-color:var(--c) transparent}
.list{list-style:none;margin:0;padding:0 6px 0 0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:6px}
.list::-webkit-scrollbar,.notes::-webkit-scrollbar,.drawer::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb,.notes::-webkit-scrollbar-thumb{background:var(--c);border-radius:6px}
.notes{width:100%;resize:none;overscroll-behavior:contain}
.list li{display:flex;gap:6px;flex:none}
.item{flex:1;min-width:0;text-align:left;font:inherit;color:var(--tx);background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;transition:.2s}
.item:hover,.item.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.item b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{color:var(--mut)}
.del{width:40px;font:inherit;color:var(--mut);background:none;border:1px solid transparent;border-radius:10px;cursor:pointer}
.del:hover{color:#fb7185;border-color:var(--line)}
.empty{color:var(--mut);padding:12px}
.stage{aspect-ratio:16/9;width:100%;max-width:1100px;margin:14px auto 0;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.stage iframe,.stage video{width:100%;height:100%;border:0;display:block}
.fallback{height:100%;display:grid;place-items:center;text-align:center;color:#9aa3bf;padding:20px}
#nowTitle{margin:0;color:var(--mut)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:100%;z-index:150;overflow-y:auto;padding:18px;background:var(--bg);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.35);visibility:hidden;transform:translateX(100%);transition:transform .3s,visibility .3s}
.drawer.open{visibility:visible;transform:none}
.drawer h4{margin:20px 0 8px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.dh{display:flex;justify-content:space-between;align-items:center}
.drawer label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
.drawer label input[type=number]{width:80px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.mrow{display:flex;gap:8px;margin-bottom:8px}.mrow input[data-m=name]{flex:1}
#toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:340px}
.toast{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:14px;background:var(--bg);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast span{color:var(--mut)}.toast div{display:flex;gap:8px}
@media(max-width:900px){.hdr{padding:10px 16px}main{padding:12px 16px 60px}.slot{grid-template-columns:1fr 1fr}.slot.head{display:none}.today{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="hdr">
  <div class="brand">Study<span>Deck</span></div>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="timer" role="group" aria-label="Focus timer" data-mode="focus">
    <select id="tSub" aria-label="Timer subject"></select>
    <input id="tMin" type="number" min="1" max="600" aria-label="Focus minutes">
    <output id="tDisp">25:00</output><span class="chip" id="tMode">Focus</span>
    <button id="tGo" class="btn pri">Start</button>
    <button id="tReset" class="btn" aria-label="Reset timer">↺</button>
    <button id="gear" class="btn" aria-label="Customize">⚙</button>
  </div>
</header>
<main>
  <section id="timetable" tabindex="-1" aria-labelledby="h-tt">
    <div class="sh"><h2 id="h-tt">Timetable</h2>
      <div><button class="btn" id="notif">🔔 Desktop alerts</button> <button class="btn pri" id="addSlot">+ Add slot</button></div></div>
    <div class="glass today">
      <div><small>Today</small><b id="tdVal">0m</b><div class="bar"><i id="tdBar"></i></div><small id="tdGoal"></small></div>
      <div><small>Streak 🔥</small><b id="tdStreak">0 days</b></div>
      <div><small>Pomodoros</small><b id="tdPomo">0</b></div>
    </div>
    <div class="glass">
      <div class="slot head" aria-hidden="true"><span>Start time</span><span>Subject</span><span>Minutes</span><span></span><span></span></div>
      <div id="slots"></div>
    </div>
  </section>
  <section id="subjects" tabindex="-1" aria-labelledby="h-sub">
    <div class="sh"><h2 id="h-sub">Subjects</h2><button class="btn" id="addSub">+ Add subject</button></div>
    <div class="cards" id="cards"></div>
  </section>
  <section id="player" tabindex="-1" aria-labelledby="h-pl">
    <div class="sh"><h2 id="h-pl">Player</h2><a id="openLink" class="btn" href="#" target="_blank" rel="noopener" hidden>Open original ↗</a></div>
    <p id="nowTitle">Nothing playing yet.</p>
    <div class="stage" id="stage"><div class="fallback"><p>Pick a video from any subject to play it here.</p></div></div>
  </section>
</main>
<aside id="drawer" class="drawer" aria-label="Customize">
  <div class="dh"><h2>Customize</h2><button class="btn" id="dClose" aria-label="Close">✕</button></div>
  <h4>Theme</h4><div class="chips" id="themes"></div>
  <h4>Accent</h4><div class="chips" id="accs"></div>
  <label>Custom accent <input type="color" data-k="acc"></label>
  <label>Background <select data-k="bg"><option value="aurora">Aurora glow</option><option value="grid">Grid</option><option value="solid">Solid</option></select></label>
  <h4>Layout</h4>
  <label>Glass blur <input type="range" min="0" max="30" data-k="blur"></label>
  <label>Text size <input type="range" min="13" max="18" data-k="font"></label>
  <label>Spacing <input type="range" min="8" max="36" data-k="dens"></label>
  <label>Playlist height <input type="range" min="160" max="520" step="20" data-k="ch"></label>
  <h4>Timer, sound &amp; goals</h4>
  <label>Break (min) <input type="number" min="1" max="60" data-k="brk"></label>
  <label>Long break (min) <input type="number" min="1" max="90" data-k="long"></label>
  <label>Daily goal (min) <input type="number" min="10" max="1440" data-k="goal"></label>
  <label>Auto-start breaks <input type="checkbox" data-k="auto"></label>
  <label>Sound <input type="checkbox" data-k="snd"></label>
  <label>Volume <input type="range" min="0" max="100" data-k="vol"></label>
  <h4>Subjects</h4><div id="subMgr"></div>
  <h4>Data</h4>
  <div class="chips"><button class="btn" id="exp">Export</button><label class="btn" style="margin:0">Import<input type="file" id="imp" accept="application/json" hidden></label><button class="btn" id="rst">Reset all</button></div>
</aside>
<div id="toasts" aria-live="polite"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY='studyDash.v1',COLORS=['#5b8def','#34d3a3','#f5a524','#f472b6','#a78bfa','#fb7185'];
const THEMES={midnight:'Midnight',aurora:'Aurora',sunset:'Sunset',forest:'Forest',paper:'Paper (light)'};
const DEF={subjects:['Physics','Chemistry','Math'].map((n,i)=>({id:n.toLowerCase(),name:n,color:COLORS[i],items:[],secs:0,notes:''})),
  slots:[{id:uid(),time:'18:00',sub:'physics',mins:45},{id:uid(),time:'19:00',sub:'chemistry',mins:45},{id:uid(),time:'20:00',sub:'math',mins:45}],
  timer:{sub:'physics',mins:25},now:null,log:{},pomo:{},
  cfg:{theme:'midnight',acc:'#5b8def',bg:'aurora',blur:14,font:15,dens:20,ch:280,brk:5,long:15,goal:120,auto:true,snd:true,vol:60}};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch{}
S=Object.assign(structuredClone(DEF),S&&S.subjects?S:{});S.cfg=Object.assign({},DEF.cfg,S.cfg);
const C=S.cfg;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
const sub=id=>S.subjects.find(s=>s.id===id)||S.subjects[0];
const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m`};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u}};
const day=()=>new Date().toLocaleDateString('en-CA');

/* ---------- scrolling ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const go=el=>el&&el.scrollIntoView({behavior:reduce.matches?'auto':'smooth',block:'start'});
const hh=()=>document.documentElement.style.setProperty('--hh',($('.hdr').offsetHeight+12)+'px');
addEventListener('resize',hh);
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');if(!a||a.getAttribute('href')==='#')return;
  const t=$(a.getAttribute('href'));if(!t)return;
  e.preventDefault();go(t);t.focus({preventScroll:true});history.replaceState(null,'',a.hash);
});

/* ---------- customization ---------- */
function apply(){
  const r=document.documentElement,st=r.style;r.dataset.theme=C.theme;r.dataset.bg=C.bg;
  st.setProperty('--acc',C.acc);st.setProperty('--blur',C.blur+'px');st.setProperty('--fs',C.font+'px');st.setProperty('--ch',C.ch+'px');st.setProperty('--gap',C.dens+'px');
  $$('[data-a=theme]').forEach(b=>b.classList.toggle('on',b.dataset.t===C.theme));hh();stats();
}
$('#themes').innerHTML=Object.entries(THEMES).map(([k,v])=>`<button class="btn" data-a="theme" data-t="${k}">${v}</button>`).join('');
$('#accs').innerHTML=COLORS.map(c=>`<button class="sw" style="background:${c}" data-a="acc" data-c="${c}" aria-label="Accent ${c}"></button>`).join('');
$$('[data-k]').forEach(i=>{const k=i.dataset.k;if(i.type==='checkbox')i.checked=C[k];else i.value=C[k];
  i.oninput=()=>{C[k]=i.type==='checkbox'?i.checked:(i.type==='range'||i.type==='number')?+i.value:i.value;save();apply()}});
const openD=()=>{$('#drawer').classList.add('open');$('#dClose').focus()},closeD=()=>{$('#drawer').classList.remove('open');$('#gear').focus()};
$('#gear').onclick=openD;$('#dClose').onclick=closeD;
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#drawer').classList.contains('open'))closeD()});
function renderMgr(){$('#subMgr').innerHTML=S.subjects.map(s=>`<div class="mrow" data-id="${s.id}"><input type="color" value="${s.color}" data-m="color" aria-label="Colour"><input data-m="name" value="${esc(s.name)}" aria-label="Subject name"><button class="btn" data-a="delSub" aria-label="Delete ${esc(s.name)}">✕</button></div>`).join('')}
$('#subMgr').addEventListener('change',e=>{const m=e.target.dataset.m;if(!m)return;const s=sub(e.target.closest('.mrow').dataset.id);s[m]=m==='name'?(e.target.value.trim()||s.name):e.target.value;save();renderAll()});
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='study-dashboard-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.subjects)||!d.subjects.length)throw 0;localStorage.setItem(KEY,JSON.stringify(d));location.reload()}catch{toast('Import failed','That file isn’t a valid backup.')}})};
$('#rst').onclick=()=>{if(confirm('Erase all data and settings?')){try{localStorage.removeItem(KEY)}catch{}location.reload()}};

/* ---------- rendering ---------- */
const subOpts=sel=>S.subjects.map(s=>`<option value="${s.id}"${s.id===sel?' selected':''}>${esc(s.name)}</option>`).join('');
function listHTML(s){
  return s.items.length?s.items.map(it=>`<li><button class="item${S.now&&S.now.iid===it.id?' on':''}" data-a="play" data-i="${it.id}" title="${esc(it.url)}"><b>${esc(it.title)}</b><small>${esc(host(it.url))}</small></button><button class="del" data-a="delItem" data-i="${it.id}" aria-label="Remove ${esc(it.title)}">✕</button></li>`).join('')
  :`<li class="empty">No videos yet — paste a link above.</li>`;
}
function renderList(id){const c=$(`[data-s="${id}"]`);if(c)$('.list',c).innerHTML=listHTML(sub(id))}
function renderSlots(){
  $('#slots').innerHTML=S.slots.map(x=>`<div class="slot" data-id="${x.id}">
    <input type="time" data-f="time" value="${x.time}" aria-label="Start time">
    <select data-f="sub" aria-label="Subject">${subOpts(x.sub)}</select>
    <input type="number" data-f="mins" min="1" max="600" value="${x.mins}" aria-label="Duration in minutes">
    <button class="btn" data-a="slotStart">▶ Start</button>
    <button class="btn" data-a="slotDel" aria-label="Remove slot">✕</button></div>`).join('')||'<p class="empty">No slots yet — add one.</p>';
}
function renderAll(){
  $('#nav').innerHTML='<a href="#timetable">Timetable</a>'+S.subjects.map(s=>`<a href="#sub-${s.id}" style="--c:${s.color}">${esc(s.name)}</a>`).join('')+'<a href="#player">Player</a>';
  $('#tSub').innerHTML=subOpts(S.timer.sub);$('#tMin').value=S.timer.mins;
  renderSlots();
  $('#cards').innerHTML=S.subjects.map(s=>`<article class="card" id="sub-${s.id}" data-s="${s.id}" tabindex="-1" style="--c:${s.color}" aria-label="${esc(s.name)}">
    <header><h3>${esc(s.name)}</h3><span class="chip" data-stat="${s.id}"></span></header>
    <div class="tabs"><button data-a="tab" data-t="list" class="on">Videos</button><button data-a="tab" data-t="notes">Notes</button></div>
    <form class="add" data-s="${s.id}">
      <input name="t" placeholder="Title (optional)" aria-label="Title">
      <input name="u" placeholder="Paste video or playlist URL" required aria-label="Video URL">
      <button class="btn pri">Add</button>
    </form>
    <ul class="list" aria-label="${esc(s.name)} videos">${listHTML(s)}</ul>
    <textarea class="notes" hidden placeholder="Notes for ${esc(s.name)}…" aria-label="${esc(s.name)} notes">${esc(s.notes||'')}</textarea>
    <footer><button class="btn" data-a="cardStart">⏱ Focus on ${esc(s.name)}</button></footer></article>`).join('');
  stats();hh();
}
function stats(){
  S.subjects.forEach(s=>{const el=$(`[data-stat="${s.id}"]`);
    if(el)el.textContent=`${fmt(s.secs)} studied · ${S.slots.filter(x=>x.sub===s.id).reduce((a,x)=>a+x.mins,0)}m planned`});
  const t=S.log[day()]||0,g=C.goal*60,k=streak();
  $('#tdVal').textContent=fmt(t);$('#tdBar').style.width=Math.min(100,t/g*100)+'%';
  $('#tdGoal').textContent=`Goal ${fmt(g)}`+(t>=g?' ✓ reached':'');
  $('#tdStreak').textContent=`${k} day${k===1?'':'s'}`;$('#tdPomo').textContent=S.pomo[day()]||0;
}
function streak(){let n=0;const d=new Date(),k=()=>d.toLocaleDateString('en-CA');
  if((S.log[k()]||0)<600)d.setDate(d.getDate()-1);
  while((S.log[k()]||0)>=600){n++;d.setDate(d.getDate()-1)}return n}

/* ---------- video player ---------- */
function embed(u){
  let x;try{x=new URL(u)}catch{return null}
  if(!/^https?:$/.test(x.protocol))return null;
  const h=x.hostname.replace(/^www\.|^m\./,''),list=x.searchParams.get('list');let id=null;
  if(h==='youtu.be')id=x.pathname.slice(1);
  else if(h==='youtube.com'||h==='music.youtube.com'){
    if(x.pathname==='/watch')id=x.searchParams.get('v');
    else{const m=x.pathname.match(/^\/(embed|shorts|live)\/([\w-]{6,})/);if(m)id=m[2]}
    if(!id&&list&&x.pathname==='/playlist')return{t:'yt',src:`https://www.youtube-nocookie.com/embed/videoseries?list=${encodeURIComponent(list)}`};
  }
  if(id&&/^[\w-]{6,}$/.test(id))return{t:'yt',src:`https://www.youtube-nocookie.com/embed/${id}?rel=0`+(list?`&list=${encodeURIComponent(list)}`:'')};
  if(/\.(mp4|webm|ogg)$/i.test(x.pathname))return{t:'file',src:u};
  return{t:'link'};
}
const find=(sid,iid)=>{const s=S.subjects.find(s=>s.id===sid);return s&&s.items.find(i=>i.id===iid)};
function show(it){
  const e=embed(it.url),st=$('#stage');let n;st.replaceChildren();
  if(e&&e.t==='yt'){n=document.createElement('iframe');n.src=e.src;n.title=it.title;n.allowFullscreen=true;
    n.allow='accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen';n.referrerPolicy='strict-origin-when-cross-origin'}
  else if(e&&e.t==='file'){n=document.createElement('video');n.src=e.src;n.controls=true}
  else{n=document.createElement('div');n.className='fallback';
    n.innerHTML=`<p><b>${e?'This link can’t be embedded here.':'This URL looks invalid.'}</b><br>Use “Open original” to view it in a new tab.</p>`}
  st.append(n);$('#nowTitle').textContent='Now playing: '+it.title;
  const l=$('#openLink');l.href=it.url;l.hidden=false;
}
function play(sid,iid){
  const it=find(sid,iid);if(!it)return;
  S.now={sid,iid};save();show(it);
  $$('.item').forEach(b=>b.classList.toggle('on',b.dataset.i===iid));go($('#player'));
}
function setTab(card,t){$$('.tabs button',card).forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('.list',card).hidden=t!=='list';$('.notes',card).hidden=t!=='notes'}

/* ---------- toasts, sound, alarms ---------- */
let ac;const unlock=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}};
addEventListener('pointerdown',unlock,{once:true});addEventListener('keydown',unlock,{once:true});
function beep(){if(!ac||!C.snd)return;const v=Math.max(.001,C.vol/100*.4);
  [0,.35,.7].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;
    o.frequency.value=880;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.28);o.start(n);o.stop(n+.3)})}
function toast(t,m,acts=[],sticky=false){
  const n=document.createElement('div');n.className='toast';n.setAttribute('role',sticky?'alert':'status');
  n.innerHTML=`<b>${esc(t)}</b><span>${esc(m)}</span>`;const r=document.createElement('div');
  acts.concat([{label:'Dismiss'}]).forEach(a=>{const b=document.createElement('button');b.className='btn'+(a.fn?' pri':'');b.textContent=a.label;
    b.onclick=()=>{n.remove();a.fn&&a.fn()};r.append(b)});
  n.append(r);$('#toasts').append(n);if(!sticky)setTimeout(()=>n.remove(),4500);
}
function ring(t,m,acts){toast(t,m,acts,true);unlock();beep();try{Notification.permission==='granted'&&new Notification(t,{body:m})}catch{}}
const fired=new Set();
setInterval(()=>{const d=new Date(),hm=d.toTimeString().slice(0,5),k=d.toDateString();
  S.slots.forEach(x=>{const key=x.id+k;if(x.time===hm&&!fired.has(key)){fired.add(key);
    ring(`Time for ${sub(x.sub).name}`,`Scheduled for ${x.time} · ${x.mins} min`,[{label:'▶ Start now',fn:()=>begin(x.sub,x.mins)}])}})},10000);
$('#notif').onclick=()=>{if(!('Notification' in window))return toast('Alerts','Desktop notifications aren’t supported in this browser.');
  Notification.requestPermission().then(p=>toast('Alerts',p==='granted'?'Desktop alerts enabled.':'Permission not granted.'))};

/* ---------- timer (focus + breaks) ---------- */
const T={run:false,mode:'focus',left:S.timer.mins*60,last:0,iv:null,n:0};
function drawTimer(){
  const m=Math.floor(T.left/60),s=T.left%60,t=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  $('#tDisp').textContent=t;$('#tGo').textContent=T.run?'Pause':'Start';
  $('.timer').dataset.mode=T.mode;$('#tMode').textContent=T.mode==='focus'?'Focus':'Break';
  document.title=T.run?`${t} · ${T.mode==='focus'?'Focus':'Break'}`:'Study Dashboard';
}
function run(){T.run=true;T.last=Date.now();clearInterval(T.iv);T.iv=setInterval(tick,250);drawTimer();unlock()}
function pause(){T.run=false;clearInterval(T.iv);drawTimer()}
function tick(){
  const d=Math.min(Math.floor((Date.now()-T.last)/1000),T.left);if(d<1)return;
  T.last+=d*1000;T.left-=d;
  if(T.mode==='focus'){sub(S.timer.sub).secs+=d;S.log[day()]=(S.log[day()]||0)+d;save()}
  stats();drawTimer();if(!T.left)done();
}
function endBreak(notify){pause();T.mode='focus';T.left=S.timer.mins*60;drawTimer();
  if(notify)ring('Break over','Ready for the next focus session?',[{label:'▶ Start focus',fn:run}])}
function done(){
  pause();
  if(T.mode==='focus'){
    S.pomo[day()]=(S.pomo[day()]||0)+1;T.n++;const m=T.n%4===0?C.long:C.brk;
    T.mode='break';T.left=m*60;save();stats();drawTimer();
    ring(`${sub(S.timer.sub).name} session complete`,`Take a ${m}-minute break.`,[{label:'Skip break',fn:()=>endBreak()}]);
    if(C.auto)run();
  }else endBreak(true);
}
function begin(sid,mins){S.timer.sub=sid;S.timer.mins=mins;T.mode='focus';$('#tSub').value=sid;$('#tMin').value=mins;T.left=mins*60;save();run()}
$('#tGo').onclick=()=>{if(T.run)pause();else{if(!T.left)T.left=S.timer.mins*60;run()}};
$('#tReset').onclick=()=>{pause();T.mode='focus';T.left=S.timer.mins*60;drawTimer()};
$('#tSub').onchange=e=>{S.timer.sub=e.target.value;save()};
$('#tMin').onchange=e=>{const v=Math.min(600,Math.max(1,+e.target.value||25));e.target.value=v;S.timer.mins=v;save();if(!T.run&&T.mode==='focus'){T.left=v*60;drawTimer()}};

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,card=b.closest('[data-s]'),sid=card&&card.dataset.s,row=b.closest('.slot');
  if(a==='play')play(sid,b.dataset.i);
  else if(a==='delItem'){const s=sub(sid);s.items=s.items.filter(i=>i.id!==b.dataset.i);save();renderList(sid)}
  else if(a==='cardStart')begin(sid,S.timer.mins);
  else if(a==='tab')setTab(card,b.dataset.t);
  else if(a==='theme'){C.theme=b.dataset.t;save();apply()}
  else if(a==='acc'){C.acc=b.dataset.c;$('[data-k=acc]').value=C.acc;save();apply()}
  else if(a==='slotStart'){const x=S.slots.find(x=>x.id===row.dataset.id);if(x)begin(x.sub,x.mins)}
  else if(a==='slotDel'){S.slots=S.slots.filter(x=>x.id!==row.dataset.id);save();renderSlots();stats()}
  else if(a==='delSub'){
    const id=b.closest('.mrow').dataset.id,s=sub(id);
    if(S.subjects.length<2)return toast('Can’t delete','Keep at least one subject.');
    if(!confirm(`Delete “${s.name}” and its videos and notes?`))return;
    S.subjects=S.subjects.filter(x=>x.id!==id);const f=S.subjects[0].id;
    S.slots.forEach(x=>{if(x.sub===id)x.sub=f});if(S.timer.sub===id)S.timer.sub=f;
    save();renderAll();renderMgr();
  }
});
$('#slots').addEventListener('change',e=>{
  const f=e.target.dataset.f,row=e.target.closest('.slot');if(!f)return;
  const x=S.slots.find(x=>x.id===row.dataset.id);if(!x)return;
  x[f]=f==='mins'?Math.max(1,+e.target.value||1):e.target.value;save();stats();
});
$('#addSlot').onclick=()=>{S.slots.push({id:uid(),time:'09:00',sub:S.subjects[0].id,mins:30});save();renderSlots();stats()};
$('#addSub').onclick=()=>{
  const n=(prompt('New subject name')||'').trim();if(!n)return;
  let id=n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||uid();
  if(S.subjects.some(s=>s.id===id))id+='-'+uid().slice(0,3);
  S.subjects.push({id,name:n,color:COLORS[S.subjects.length%COLORS.length],items:[],secs:0,notes:''});
  save();renderAll();renderMgr();go($('#sub-'+id));
};
$('#cards').addEventListener('input',e=>{if(e.target.classList.contains('notes')){sub(e.target.closest('.card').dataset.s).notes=e.target.value;save()}});
$('#cards').addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,s=sub(f.dataset.s),card=f.closest('.card');let u=f.u.value.trim(),ok=false;
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(u))u='https://'+u;
  try{ok=/^https?:$/.test(new URL(u).protocol)&&u.includes('.')}catch{}
  if(!ok)return toast('Invalid URL','Please paste a full http(s) link.');
  s.items.push({id:uid(),title:f.t.value.trim()||`${s.name} video ${s.items.length+1}`,url:u});
  save();f.reset();setTab(card,'list');renderList(s.id);const l=$('.list',card);l.scrollTop=l.scrollHeight;
});

/* ---------- init ---------- */
renderAll();renderMgr();apply();drawTimer();
if(S.now){const it=find(S.now.sid,S.now.iid);if(it)show(it)}
</script>
</body>
